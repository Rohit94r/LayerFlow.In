name: CI

# No repository secrets are required. Backend tests run against in-memory
# Postgres (PGlite) and mocked Redis; the frontend builds from mock data.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck · verify · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck — contracts
        run: npm run typecheck --workspace @layerflow/contracts

      - name: Typecheck — model-registry
        run: npm run typecheck --workspace @layerflow/model-registry

      - name: Typecheck — api
        run: npm run typecheck --workspace @layerflow/api

      - name: Verify DB migrations (in-memory Postgres)
        run: npm run db:verify --workspace @layerflow/api

      - name: API tests
        run: npm test --workspace @layerflow/api

      - name: Build frontend (Next.js)
        run: npm run build

      - name: Typecheck — repo root
        run: npx tsc --noEmit -p tsconfig.json
