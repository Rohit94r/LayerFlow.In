# LayerFlow production deployment for 2GB RAM VPS (Hostinger)
# Memory budget: API 512MB + Worker 256MB + PG 256MB + Redis 128MB + Nginx 64MB = ~1.2GB
# Leaves 800MB for OS + overhead.
#
# RECOMMENDED: Use Neon (free PG) + Upstash (free Redis) instead of local.
# That saves ~384MB and uses only ~800MB total.
#
# Quick start:
#   git clone https://github.com/Rohit94r/LayerFlow.In.git /opt/layerflow
#   cd /opt/layerflow
#   cp .env.production .env  # fill secrets
#   docker compose -f docker-compose.prod.yml up -d
#
# SSL (first time only):
#   docker compose -f docker-compose.prod.yml run --rm certbot certonly --webroot \
#     -w /var/www/certbot -d api.layerflow.dev

services:
  # ── Reverse proxy (SSL termination) ────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: lf-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - lf-net
    deploy:
      resources:
        limits:
          memory: 64M

  # ── API server (Hono) ──────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: layerflow/api:latest
    container_name: lf-api
    restart: unless-stopped
    env_file: .env
    expose:
      - "8787"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lf-net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ── Background worker (BullMQ) ─────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: layerflow/worker:latest
    container_name: lf-worker
    restart: unless-stopped
    env_file: .env
    command: ["node", "--max-old-space-size=256", "dist/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lf-net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ── PostgreSQL (skip if using Neon - set DATABASE_URL in .env) ──────────
  postgres:
    profiles:
      - local-db
    image: postgres:16-alpine
    container_name: lf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: layerflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: layerflow
    volumes:
      - lf-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U layerflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lf-net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ── Redis (skip if using Upstash - set REDIS_URL in .env) ───────────────
  redis:
    profiles:
      - local-db
    image: redis:7-alpine
    container_name: lf-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - lf-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - lf-net
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # ── Certbot (run once to get SSL) ───────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: lf-certbot
    profiles:
      - ssl-setup
    volumes:
      - ./data/certbot/www:/var/www/certbot
      - ./data/certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 12h & wait; done;'"

networks:
  lf-net:
    driver: bridge

volumes:
  lf-pgdata:
  lf-redisdata:
