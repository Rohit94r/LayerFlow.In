version: 2

project_name: lf

before:
  hooks:
    - go mod tidy

builds:
  - id: lf
    main: ./cmd/lf
    binary: lf
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^build:'

# Releases land in the PUBLIC binary-only repo. The source stays private;
# the release token (GH_TOKEN) is a fine-grained PAT scoped to that repo.
release:
  github:
    owner: Rohit94r
    name: layerflow-releases

# Homebrew formula is pushed to the PUBLIC formula-only tap repo. Install:
#   brew install Rohit94r/tap/lf
brews:
  - name: lf
    homepage: https://github.com/Rohit94r/layerflow-releases
    description: "LayerFlow Terminal (lf) — local-first AI terminal workspace with streaming, tools, memory, and cloud sync."
    license: MIT
    repository:
      owner: Rohit94r
      name: homebrew-tap
    directory: Formula
    url_template: "https://github.com/Rohit94r/layerflow-releases/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    commit_author:
      name: LayerFlow Release Bot
      email: bot@layerflow.dev
    install: |
      bin.install "lf"
    test: |
      assert_match(/LayerFlow/, shell_output("#{bin}/lf version"))
