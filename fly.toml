# Fly.io configuration for the LayerFlow API (docs/backend.md picks Fly as the
# primary host). One image, two process groups: the always-on Hono API and the
# BullMQ worker. Deploy from the repo root:  fly deploy
#
# First-time setup and the full secrets matrix live in docs/deployment.md.

app = "layerflow-api"
primary_region = "iad" # Ashburn — same US-East region as the Neon database

[build]
  dockerfile = "apps/api/Dockerfile"

# Runs once per release, on a throwaway machine, BEFORE new machines go live.
# Forward-only Drizzle migrations against DATABASE_URL. Deploy aborts if it fails.
[deploy]
  release_command = "npm run db:migrate --workspace @layerflow/api"
  strategy = "rolling"

# Non-secret defaults. All real secrets are set with `fly secrets set` (see docs).
[env]
  NODE_ENV = "production"
  PORT = "8787"

[processes]
  app = "node apps/api/dist/index.js"
  worker = "node apps/api/dist/worker.js"

# HTTP front door — applies to the `app` process only (the worker has no server).
[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1 # always-on for low-latency streaming (see docs/backend.md)
  processes = ["app"]

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"

# Machine sizing. Bump memory/cpu later with `fly scale`.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app", "worker"]
